default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (changed Python files)
        entry: mise exec -- uv run --locked ruff check
        language: system
        types: [python]
      - id: pytest
        name: Test suite
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: build
        name: Distribution build
        entry: mise run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
