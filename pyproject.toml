[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutagi"
version = "0.2.0"
description = "Support autonomous exploration and human harvesting of its results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
mutagi = "mutagi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/mutagi"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/mutagi",
    "tests",
    "docs",
    "examples",
    "scripts",
    "CHANGELOG.md",
    ".github",
    ".gitignore",
    ".pre-commit-config.yaml",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "mise.toml",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
